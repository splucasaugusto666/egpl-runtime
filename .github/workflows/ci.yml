name: CI and public research release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: egpl-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m egpl.cli benchmark
      - run: python -m pip install .
      - run: egpl validate examples/contract.json
      - run: egpl run examples/contract.json examples/fixtures.json --steps 1 --output checkpoint.json
      - run: egpl resume examples/contract.json examples/fixtures.json checkpoint.json
      - run: egpl run examples/typed-contract.json examples/typed-fixtures.json
      - run: egpl check examples/agent-contract.json examples/agent-candidate.txt
      - run: egpl run examples/composite-contract.json examples/composite-fixtures.json
      - run: egpl study-prepare examples/behavior-study.json --repeats 2 --seed 17 > trials.json
      - run: echo '{}' > responses.json && egpl study-score examples/behavior-study.json trials.json responses.json --model fixture --mode fixture
      - run: egpl prompt-list && egpl prompt-render research examples/prompt-task.json
      - run: python examples/adaptive-demo.py
      - name: Composite action accepts valid candidate
        uses: ./
        with:
          contract: examples/composite-contract.json
          candidate: examples/composite-candidate.json
      - name: Composite action rejects invalid candidate
        id: rejected
        continue-on-error: true
        uses: ./
        with:
          contract: examples/composite-contract.json
          candidate: examples/composite-rejected.json
      - name: Assert action rejected invalid candidate
        if: steps.rejected.outcome != 'failure'
        run: exit 1
  release:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Publish research preview once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python -c 'import tomllib; print("v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; not modifying it."
            exit 0
          fi
          gh release create "$TAG" dist/*.whl --target "$GITHUB_SHA" --prerelease --title "EGPL Runtime $TAG — Research Preview" --notes "Experimental Python runtime with bounded attempts, typed deterministic evidence gates, checkpoint replay, invariant-preserving strategy selection, CLI and synthetic benchmarks. CI required before publication. Fixture and optional loopback Ollama adapter, portable Agent Skill, composite named predicates and reusable GitHub Action, behavioral research lab and five provider wire codecs, paired adaptation, held-out transfer and six portable prompts; no live-model evaluation; no real LLM performance claims, authenticated provenance or hard token/time budgets."
